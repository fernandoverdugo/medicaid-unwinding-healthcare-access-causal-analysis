name: quality-checks

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Import treatment construction module
        run: python -c "import sys; sys.path.insert(0, 'src'); import build_unwinding_exposure"

      - name: Run tests
        run: python -m pytest -q

      - name: Validate causal analysis contract
        run: python src/validate_config.py
