name: quality-checks

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Import treatment construction module
        run: python -c "import sys; sys.path.insert(0, 'src'); import build_unwinding_exposure"

      - name: Fetch live CMS treatment data
        run: python src/fetch_cms_eligibility_processing.py

      - name: Build and audit treatment exposure
        run: python src/build_unwinding_exposure.py

      - name: Fetch ACS outcome data
        run: python src/fetch_acs_outcomes.py

      - name: Build ACS outcome panel
        run: python src/build_outcome_panel.py

      - name: Run pre-treatment trend diagnostics
        run: python src/pretrend_diagnostic.py

      - name: Estimate primary DiD
        run: python src/estimate_primary_did.py

      - name: Estimate event study
        run: python src/event_study.py

      - name: Run robustness checks
        run: python src/robustness_checks.py

      - name: Build dashboard
        run: python src/build_dashboard.py

      - name: Validate dashboard
        run: python src/validate_dashboard.py

      - name: Run tests
        run: python -m pytest -q

      - name: Validate causal analysis contract
        run: python src/validate_config.py
