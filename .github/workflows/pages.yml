name: pages

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "docs/**"
      - "config/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch CMS treatment data
        run: python src/fetch_cms_eligibility_processing.py

      - name: Build treatment exposure
        run: python src/build_unwinding_exposure.py

      - name: Fetch ACS outcomes
        run: python src/fetch_acs_outcomes.py

      - name: Build outcome panel
        run: python src/build_outcome_panel.py

      - name: Run pretrend diagnostics
        run: python src/pretrend_diagnostic.py

      - name: Estimate primary DiD
        run: python src/estimate_primary_did.py

      - name: Estimate event study
        run: python src/event_study.py

      - name: Run robustness checks
        run: python src/robustness_checks.py

      - name: Build dashboard
        run: python src/build_dashboard.py

      - name: Validate dashboard
        run: python src/validate_dashboard.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
